<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="520" height="180" role="img" aria-labelledby="title" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">Gydo's Verdant – Houseplants and pots</title>
  <defs>
    <linearGradient id="leafA" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5FA777"/>
      <stop offset="1" stop-color="#A9D8A2"/>
    </linearGradient>
    <linearGradient id="leafB" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7DBF8A"/>
      <stop offset="1" stop-color="#C8E8BE"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3EDE3"/>
      <stop offset="1" stop-color="#E4DACB"/>
    </linearGradient>
  </defs>

  <!-- Plant mark -->
  <g transform="translate(30 18)">
    <!-- stems -->
    <path d="M60 104 C60 80 58 60 50 40" fill="none" stroke="#5FA777" stroke-width="3" stroke-linecap="round"/>
    <path d="M60 104 C62 84 70 70 84 58" fill="none" stroke="#5FA777" stroke-width="3" stroke-linecap="round"/>
    <path d="M60 104 C58 92 48 82 32 76" fill="none" stroke="#5FA777" stroke-width="3" stroke-linecap="round"/>
    <!-- leaves -->
    <path d="M50 40 C30 30 30 8 44 0 C60 10 62 30 50 40 Z" fill="url(#leafA)"/>
    <path d="M84 58 C90 38 110 32 122 40 C114 58 98 64 84 58 Z" fill="url(#leafB)"/>
    <path d="M32 76 C18 82 2 74 0 60 C14 54 28 62 32 76 Z" fill="url(#leafB)"/>
    <!-- leaf veins -->
    <path d="M50 40 C46 28 44 14 44 2" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M84 58 C96 50 108 44 120 41" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M32 76 C22 68 12 63 2 61" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- pot -->
    <rect x="28" y="100" width="64" height="12" rx="4" fill="#D9CDBB"/>
    <path d="M33 112 H87 L81 142 a6 6 0 0 1 -6 5 H45 a6 6 0 0 1 -6 -5 Z" fill="url(#pot)" stroke="#D9CDBB" stroke-width="1.5"/>
    <path d="M42 124 H78" stroke="#A9D8A2" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="180" y="66" font-family="'Montserrat','Poppins','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" letter-spacing="6" fill="#7A9E86">GYDO'S</text>
  <text x="176" y="124" font-family="'Cormorant Garamond','Playfair Display','Georgia',serif" font-size="66" font-weight="500" letter-spacing="1" fill="#2F6B4A">Verdant</text>
  <text x="180" y="156" font-family="'Montserrat','Poppins','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" letter-spacing="4.5" fill="#8FB89A">HOUSEPLANTS &amp; POTS</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
